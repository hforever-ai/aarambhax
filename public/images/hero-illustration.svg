<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-label="Aarambhax — legal drafting illustration">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="var(--surface, #FFFFFF)"/>
      <stop offset="100%" stop-color="var(--surface-2, #F1ECE0)"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#C8A24B"/>
      <stop offset="100%" stop-color="#D4B062"/>
    </linearGradient>
  </defs>

  <!-- Subtle rounded background -->
  <rect x="20" y="20" width="560" height="440" rx="24" fill="url(#bgGrad)" stroke="var(--border, #E5DFD0)" stroke-width="1"/>

  <!-- Left side: stylized open book -->
  <g transform="translate(80, 140)">
    <!-- Book base / pages stack -->
    <path d="M 0 200 L 0 60 Q 0 50 10 50 L 110 50 Q 120 50 120 40 L 120 200 Z"
          fill="var(--fg, #0B1F3A)" opacity="0.92"/>
    <path d="M 240 200 L 240 60 Q 240 50 230 50 L 130 50 Q 120 50 120 40 L 120 200 Z"
          fill="var(--fg, #0B1F3A)" opacity="0.92"/>

    <!-- Page lines (text suggestion) -->
    <line x1="20"  y1="80"  x2="100" y2="80"  stroke="var(--bg, #F8F6F0)" stroke-width="2" opacity="0.7"/>
    <line x1="20"  y1="100" x2="105" y2="100" stroke="var(--bg, #F8F6F0)" stroke-width="2" opacity="0.6"/>
    <line x1="20"  y1="120" x2="95"  y2="120" stroke="var(--bg, #F8F6F0)" stroke-width="2" opacity="0.5"/>
    <line x1="20"  y1="140" x2="100" y2="140" stroke="var(--bg, #F8F6F0)" stroke-width="2" opacity="0.5"/>
    <line x1="20"  y1="160" x2="80"  y2="160" stroke="var(--bg, #F8F6F0)" stroke-width="2" opacity="0.4"/>

    <line x1="140" y1="80"  x2="220" y2="80"  stroke="var(--bg, #F8F6F0)" stroke-width="2" opacity="0.7"/>
    <line x1="140" y1="100" x2="225" y2="100" stroke="var(--bg, #F8F6F0)" stroke-width="2" opacity="0.6"/>
    <line x1="140" y1="120" x2="215" y2="120" stroke="var(--bg, #F8F6F0)" stroke-width="2" opacity="0.5"/>
    <line x1="140" y1="140" x2="220" y2="140" stroke="var(--bg, #F8F6F0)" stroke-width="2" opacity="0.5"/>
    <line x1="140" y1="160" x2="200" y2="160" stroke="var(--bg, #F8F6F0)" stroke-width="2" opacity="0.4"/>

    <!-- Gold spine highlight -->
    <line x1="120" y1="50" x2="120" y2="200" stroke="url(#goldGrad)" stroke-width="2"/>
  </g>

  <!-- Right side: abstract document with section markers + verifier badge -->
  <g transform="translate(360, 100)">
    <!-- Document card -->
    <rect x="0" y="0" width="180" height="240" rx="6"
          fill="var(--bg, #F8F6F0)" stroke="var(--fg, #0B1F3A)" stroke-width="1.5"/>

    <!-- Section heading bar -->
    <rect x="20" y="24" width="80" height="6" rx="1" fill="var(--fg, #0B1F3A)"/>

    <!-- Body text lines -->
    <line x1="20" y1="50"  x2="160" y2="50"  stroke="var(--fg-muted, #475569)" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="62"  x2="155" y2="62"  stroke="var(--fg-muted, #475569)" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="74"  x2="140" y2="74"  stroke="var(--fg-muted, #475569)" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="86"  x2="160" y2="86"  stroke="var(--fg-muted, #475569)" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="98"  x2="125" y2="98"  stroke="var(--fg-muted, #475569)" stroke-width="1.5" opacity="0.6"/>

    <!-- Inline citation with green verified badge -->
    <line x1="20" y1="120" x2="100" y2="120" stroke="var(--fg-muted, #475569)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="115" cy="120" r="6" fill="#15803D"/>
    <path d="M 112 120 L 114 122 L 119 117" stroke="var(--bg, #F8F6F0)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="128" y1="120" x2="160" y2="120" stroke="var(--fg-muted, #475569)" stroke-width="1.5" opacity="0.6"/>

    <line x1="20" y1="140" x2="155" y2="140" stroke="var(--fg-muted, #475569)" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="152" x2="140" y2="152" stroke="var(--fg-muted, #475569)" stroke-width="1.5" opacity="0.6"/>

    <!-- Second section heading -->
    <rect x="20" y="174" width="60" height="6" rx="1" fill="var(--fg, #0B1F3A)"/>

    <line x1="20" y1="196" x2="160" y2="196" stroke="var(--fg-muted, #475569)" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="208" x2="135" y2="208" stroke="var(--fg-muted, #475569)" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="220" x2="155" y2="220" stroke="var(--fg-muted, #475569)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Floating gold particles connecting book to document -->
  <circle cx="320" cy="180" r="3" fill="url(#goldGrad)"/>
  <circle cx="340" cy="200" r="2" fill="url(#goldGrad)" opacity="0.8"/>
  <circle cx="335" cy="220" r="3" fill="url(#goldGrad)" opacity="0.7"/>
  <circle cx="350" cy="240" r="2" fill="url(#goldGrad)" opacity="0.6"/>
  <circle cx="345" cy="260" r="3" fill="url(#goldGrad)" opacity="0.5"/>
</svg>
